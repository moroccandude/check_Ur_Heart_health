version: '3'

services:
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-webserver
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      # - AIRFLOW__WEBSERVER__SECRET_KEY=${WEBSERVER_SECRET_KEY:-}
      - AIRFLOW__CLI__ENDPOINT_URL=http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 120s
      timeout: 60s
      retries: 5

    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK=true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "airflow-scheduler"]
      interval: 60s
      timeout: 30s
      retries: 5

    restart: unless-stopped

  airflow-worker-1:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-worker-1
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: celery worker
    healthcheck:
      test: ["CMD", "celery", "--app", "airflow.executors.celery_executor.app", "inspect", "ping", "-d", "celery@$${HOSTNAME}"]
      interval: 60s
      timeout: 30s
      retries: 5

    restart: unless-stopped

  airflow-worker-2:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-worker-2
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: celery worker
    healthcheck:
      test: ["CMD", "celery", "--app", "airflow.executors.celery_executor.app", "inspect", "ping", "-d", "celery@$${HOSTNAME}"]
      interval: 60s
      timeout: 30s
      retries: 5

    restart: unless-stopped

  airflow-flower:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-flower
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5555:5555"
    networks:
      - project_network
    command: celery flower
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 5

    restart: unless-stopped

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-init
    user: "0:0"
    depends_on:
      redis:
        condition: service_healthy
      datanode_hadoop:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=airflow
      - _AIRFLOW_WWW_USER_PASSWORD=airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: version

  redis:
    image: redis:latest
    container_name: airflow-redis
    networks:
      - project_network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  postgres:
    image: postgres:13
    container_name: airflow-postgres
    hostname: postgres
    environment:
      - POSTGRES_DB=airflow
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project_network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow","-d","airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  namenode_hadoop:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=hadoop
      - HDFS_NAMENODE_NAME_DIR=/hadoop/dfs/name
      - HDFS_CONF_dfs_namenode_name_dir=file:///hadoop/dfs/name
      - HDFS_CONF_dfs_namenode_datanode_registration_ip_hostname_check=false
      - HDFS_CONF_dfs_namenode_safemode_threshold_pct=1 # 100% of data nodes must be available to exit safemode
      - HDFS_CONF_dfs_namenode_safemode_min_datanodes=1 # Minimum number of data nodes to exit safemode
      - HDFS_CONF_dfs_namenode_safemode_min_replication=1 # Minimum replication factor to exit safemode
      - HDFS_CONF_dfs_namenode_safemode_extension=0
    ports:
      - "9870:9870" #UI
      - "9001:9001" # for connection
    hostname: namenode
    # entrypoint: ["bin/bash","-c","sleep 30 && ./prepare_hdfs.sh"]
    volumes:
      - ./hadoop/namenode:/hadoop/dfs/name
      - ./hadoop/configurations/core-site.xml:/etc/hadoop/core-site.xml
      - ./hadoop/configurations/hdfs-site.xml:/etc/hadoop/hdfs-site.xml
      - ./data:/data
      - ./prepare_hdfs.sh:/prepare_hdfs.sh
    networks:
      - project_network    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  datanode_hadoop: 
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - CLUSTER_NAME=hadoop
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9001
      - CORE_CONF_hadoop_http_staticuser_user=root
    ports:
      - "9864:9864" #UI
    depends_on:
      namenode_hadoop:
        condition: service_healthy
    hostname: datanode
    volumes:
      - ./hadoop/datanode:/hadoop/dfs/data 
      - ./hadoop/configurations/core-site.xml:/etc/hadoop/core-site.xml
      - ./hadoop/configurations/hdfs-site.xml:/etc/hadoop/hdfs-site.xml
      
    networks:
      - project_network
    healthcheck: 
     test: ["CMD", "curl", "-f", "http://localhost:9864"]
     interval: 30s
     timeout: 40s
     retries: 5
    restart: unless-stopped

  hiveserver2:
    image: apache/hive:4.0.1
    depends_on:
      metastore:
        condition: service_healthy
      namenode_hadoop:
        condition: service_healthy
      datanode_hadoop:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    container_name: hiveserver2
    user: "0:0"
    hostname: hiveserver2
    environment:
      SERVICE_NAME: 'hiveserver2'
      HIVE_SERVER2_THRIFT_PORT: 10000
      HDFS_USER: "hive"
      HDFS_GROUP: "supergroup"
      HADOOP_HOME: /opt/hadoop
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      HIVE_CONF_hive_server2_enable_doAs: "false"
      HIVE_CONF_hive_server2_thrift_port: 10000
      HIVE_CONF_hive_server2_thrift_bind_host: "0.0.0.0"
      HIVE_CONF_hive_server2_use_SSL: "false"
      HIVE_METASTORE_DB_TYPE: postgres
      HIVE_METASTORE_DB_HOST: postgres_metastore_hive
      HIVE_METASTORE_DB_PORT: 5432
      HIVE_METASTORE_DB_NAME: metastore_db
      HIVE_METASTORE_DB_USER: hive
      HIVE_METASTORE_DB_PASSWORD: password
      HIVE_METASTORE_URIS: thrift://metastore:9083   
      DEBIAN_FRONTEND: noninteractive
      POSTGRESQL_JDBC_VERSION: "42.6.0"
    entrypoint: >
      /bin/bash -c "
      apt-get update && 
      apt-get install -y netcat-traditional curl &&
      mkdir -p /opt/hive/lib &&
      echo 'Waiting for metastore...' &&
      until nc -z metastore 9083; do 
        echo 'waiting for metastore...'; 
        sleep 2; 
      done &&
      echo 'Starting HiveServer2...' &&
      /opt/hive/bin/hiveserver2 --hiveconf hive.server2.enable.doAs=false &&
      sleep 10 &&
      echo 'Running create_hive_tables.sh ...' &&
      chmod +x ./create_hive_tables.sh && sleep 5 &&
      ./create_hive_tables.sh"
    volumes:
      - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./hadoop/configurations/core-site.xml:/etc/hadoop/core-site.xml
      - ./jars/postgresql-42.6.0.jar:/opt/hive/lib/postgresql-42.6.0.jar
      - ./create_hive_tables.sh:/opt/hive/create_hive_tables.sh
    ports:
      - "10000:10000"
    networks:
      - project_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Hive Metastore Database
  postgres_metastore_hive:
    image: postgres
    restart: unless-stopped
    container_name: postgres_metastore
    environment:
      POSTGRES_DB: 'metastore_db'
      POSTGRES_USER: 'hive'
      POSTGRES_PASSWORD: 'password'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5438:5432'
    volumes:
      - ./hive_data:/var/lib/postgresql/data
    networks:
      - project_network

  metastore:
    image: apache/hive:4.0.1
    depends_on:
      postgres_metastore_hive:
        condition: service_healthy
    restart: unless-stopped
    container_name: metastore
    hostname: metastore
    user: "0:0"
    environment:
      SERVICE_NAME: 'metastore'
      HADOOP_HOME: /opt/hadoop
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      # Logging configuration
      HIVE_METASTORE_URIS: thrift://metastore:9083   
      LOG4J_CONF: /opt/hive/conf/log4j2.properties
      HADOOP_OPTS: "-Dlog4j.configurationFile=/opt/hive/conf/log4j2.properties"
      SLF4J_LOGGER: "org.apache.logging.slf4j.Log4jLoggerFactory"
      # Metastore configuration
      HIVE_METASTORE_JDBC_URL: "jdbc:postgresql://postgres_metastore_hive:5432/metastore_db"
      HIVE_METASTORE_DRIVER: "org.postgresql.Driver"
      HIVE_METASTORE_USER: "hive"
      HIVE_METASTORE_PASSWORD: "password"
    entrypoint: >
      /bin/bash -c "
      apt-get update && 
      apt-get install -y netcat-traditional postgresql-client &&
      echo 'Waiting for PostgreSQL...' &&
      until pg_isready -h postgres_metastore_hive -p 5432 -U hive; do
        echo 'Waiting for postgres...'
        sleep 2
      done &&
      echo 'PostgreSQL is ready!' &&
      echo 'Dropping and recreating database schema...' &&
      PGPASSWORD=password psql -h postgres_metastore_hive -U hive -d metastore_db -c 'DROP SCHEMA IF EXISTS public CASCADE;' &&
      PGPASSWORD=password psql -h postgres_metastore_hive -U hive -d metastore_db -c 'CREATE SCHEMA public;' &&
      echo 'Initializing Hive schema...' &&
      /opt/hive/bin/schematool -dbType postgres -initSchema --verbose &&
      echo 'Starting Hive Metastore...' &&
      /opt/hive/bin/hive --service metastore"
   
    ports:
      - '9083:9083'
    volumes:
      - ./jars/postgresql-42.6.0.jar:/opt/hive/lib/postgresql-42.6.0.jar
      - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./hive/conf/log4j2.properties:/opt/hive/conf/log4j2.properties

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - project_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G



  atlas:
    image: sburn/apache-atlas
    container_name: atlas
    hostname: atlas
    ports:
      - "21000:21000"  # Web UI and REST API
    environment:
      - ATLAS_PROVISION_EXAMPLES=true
      - ATLAS_SOLR_MANAGED=false
      - ATLAS_NOTIFICATION_HOOK_IMPL_KAFKA=true
      - ATLAS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ATLAS_GRAPH_STORAGE_BACKEND=hbase
      - ATLAS_ZOOKEEPER_CONNECT=zookeeper:2181
      - ATLAS_GRAPH_STORAGE_HOSTNAME=zookeeper:2181
      - ATLAS_GRAPH_STORAGE_HBASE_TABLE=apache_atlas_janus
    depends_on:
      - zookeeper
      - hbase
      - hiveserver2
      - metastore
#      - atlas-init
#    volumes:
#      - ./atlas_conf/atlas-application.properties:/apache-atlas/conf/atlas-application.properties
#      - ./atlas/data:/opt/atlas/data
    networks:
      - project_network
    restart: unless-stopped

  # Zookeeper (required for Atlas)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
#    volumes:
#      - ./zookeeper/data:/var/lib/zookeeper/data
#      - ./zookeeper/log:/var/lib/zookeeper/log
    networks:
      - project_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 2181" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kafka (required for Atlas)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
#    volumes:
#      - ./kafka/data:/var/lib/kafka/data
    networks:
      - project_network
    restart: unless-stopped
    healthcheck:
     test: [ "CMD-SHELL", "/usr/bin/kafka-topics --bootstrap-server kafka:9092 --list" ]
     interval: 30s
     timeout: 10s
     retries: 5

# HBase (required for Atlas for graph storage)
  hbase:
    image: harisekhon/hbase:latest
    container_name: hbase
    hostname: hbase
    ports:
      - "16000:16000"  # HBase Master
      - "16010:16010"  # HBase Master Web UI
      - "16020:16020"  # HBase RegionServer
      - "16030:16030"  # HBase RegionServer Web UI
#    user: "0:0"
    environment:
      HBASE_MANAGES_ZK: "false"
      HBASE_ZOOKEEPER_QUORUM: zookeeper:2181
      HBASE_MASTER_PORT: 16000
#      HBASE_ROOTDIR: hdfs://namenode:9001/hbase
#      HBASE_HEAPSIZE: "1G"
#      HBASE_MASTER_INFO_PORT: 16010
    depends_on:
      - zookeeper
      - datanode_hadoop
      - namenode_hadoop
#        condition: service_healthy
    # volumes:
    #  - ./hbase/conf/hbase-site.xml:/hbase/conf/hbase-site.xml
#      - ./hbase/data:/hbase-data
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:16010/master-status" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - project_network
    restart: unless-stopped

  # Solr (used by Atlas for indexing)
  solr:
    image: solr:8
    container_name: solr
    hostname: solr
    ports:
      - "8983:8983"
    environment:
      SOLR_JAVA_MEM: "-Xms512m -Xmx1g"
#    volumes:
#      - ./solr/data:/var/solr
    command:
      - solr-precreate
      - atlas
    networks:
      - project_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8983/solr/" ]
      interval: 30s
      timeout: 10s
      retries: 5
    
  streamlit:
   build:
    context: ./report
    dockerfile: Dockerfile
   container_name: streamlit
   user: "0:0"
   entrypoint: ["streamlit", "run", "app.py", "--server.address=0.0.0.0"]
   command: ["pip install --no-cache-dir -r requirements.txt"]
   ports:
    - "8501:8501"
   networks:
    - project_network
   restart: unless-stopped
   healthcheck:
    test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health", "||", "exit", "1"]
    interval: 30s
    timeout: 10s
    retries: 5
   volumes:
    - ./report:/app

volumes:
  hadoop:
   driver: local
  postgres_data:
  hive_data:
    driver: local

networks:
  project_network:
    driver: bridge