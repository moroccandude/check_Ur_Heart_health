version: '3'

services:
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-webserver
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      # - AIRFLOW__WEBSERVER__SECRET_KEY=${WEBSERVER_SECRET_KEY:-}
      - AIRFLOW__CLI__ENDPOINT_URL=http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 120s
      timeout: 60s
      retries: 5

    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK=true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "airflow-scheduler"]
      interval: 60s
      timeout: 30s
      retries: 5

    restart: unless-stopped

  airflow-worker-1:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-worker-1
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: celery worker
    healthcheck:
      test: ["CMD", "celery", "--app", "airflow.executors.celery_executor.app", "inspect", "ping", "-d", "celery@$${HOSTNAME}"]
      interval: 60s
      timeout: 30s
      retries: 5

    restart: unless-stopped

  airflow-worker-2:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-worker-2
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: celery worker
    healthcheck:
      test: ["CMD", "celery", "--app", "airflow.executors.celery_executor.app", "inspect", "ping", "-d", "celery@$${HOSTNAME}"]
      interval: 60s
      timeout: 30s
      retries: 5

    restart: unless-stopped

  airflow-flower:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-flower
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5555:5555"
    networks:
      - project_network
    command: celery flower
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 5

    restart: unless-stopped

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-init
    user: "0:0"
    depends_on:
      redis:
        condition: service_healthy
      datanode_hadoop:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=airflow
      - _AIRFLOW_WWW_USER_PASSWORD=airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project_network
    command: version

  redis:
    image: redis:latest
    container_name: airflow-redis
    networks:
      - project_network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  postgres:
    image: postgres:13
    container_name: airflow-postgres
    hostname: postgres
    environment:
      - POSTGRES_DB=airflow
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project_network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow","-d","airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # hdfs namenode / datanode
  namenode_hadoop:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=hadoop
      - HDFS_NAMENODE_NAME_DIR=/hadoop/dfs/name
      - HDFS_CONF_dfs_namenode_safemode_threshold_pct=0
      - HDFS_CONF_dfs_namenode_safemode_min_datanodes=0
      - HDFS_CONF_dfs_namenode_safemode_extension=0
      - HDFS_NAMENODE_HTTP_PORT=9870
      - HDFS_NAMENODE_RPC_PORT=9000
    ports:
      - "9870:9870" #UI
      - "9000:9000" # for connection
    hostname: namenode
    volumes:
      - ./hadoop/namenode:/hadoop/dfs/name
      - ./hadoop/configurations/core-site.xml:/etc/hadoop/core-site.xml
      - ./hadoop/configurations/hdfs-site.xml:/etc/hadoop/hdfs-site.xml
      - ./data:/data
    networks:
      - project_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5

    restart: unless-stopped

  datanode_hadoop:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - CLUSTER_NAME=hadoop
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_datanode_data_dir=/hadoop/dfs/data
    ports:
      - "9864:9864" #UI
    depends_on:
      - namenode_hadoop
    hostname: datanode
    volumes:
      - ./hadoop/datanode:/hadoop/dfs/data
      - ./hadoop/configurations/core-site.xml:/etc/hadoop/core-site.xml
      - ./hadoop/configurations/hdfs-site.xml:/etc/hadoop/hdfs-site.xml
    networks:
      - project_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9864"]
      interval: 30s
      timeout: 40s
      retries: 5

    restart: unless-stopped

  hiveserver2:
    image: apache/hive:4.0.1
    depends_on:
      metastore:
        condition: service_started
    restart: unless-stopped
    container_name: hiveserver2
    hostname: hiveserver2
    environment:
      SERVICE_NAME: 'hiveserver2'
      HIVE_SERVER2_THRIFT_PORT: 10000
    ports:
      - '10000:10000'
    volumes:
      - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
    networks:
      - project_network

  # Hive Metastore Database
  postgres_metastore_hive:
    image: postgres:13
    restart: unless-stopped
    container_name: postgres_metastore
    environment:
      POSTGRES_DB: 'metastore_db'
      POSTGRES_USER: 'hive'
      POSTGRES_PASSWORD: 'password'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5438:5432'
    volumes:
      - ./hive-db:/var/lib/postgresql/data
    networks:
      - project_network

  # Hive Metastore
  metastore:
    image: apache/hive:4.0.1
    depends_on:
      postgres_metastore_hive:
        condition: service_healthy
    restart: unless-stopped
    container_name: metastore
    hostname: metastore
    environment:
      DB_DRIVER: postgres
      SERVICE_NAME: 'metastore'
      HIVE_METASTORE_URI: thrift://metastore:9083
      SERVICE_OPTS: >
        -Xmx1G
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres_metastore_hive:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=password
        -Ddatanucleus.autoCreateSchema=true
        -Dhive.metastore.schema.verification=false
        -Dhive.metastore.schema.verification.record.version=false
    ports:
      - '9083:9083'
    volumes:
      - ./postgresql-42.6.0.jar:/opt/hive/lib/postgresql-42.6.0.jar
      - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
    networks:
      - project_network

  # Apache Atlas (Data Governance and Metadata Framework)
  atlas:
    image: sburn/apache-atlas
    container_name: atlas
    hostname: atlas
    ports:
      - "21000:21000"  # Web UI and REST API
    environment:
      - ATLAS_PROVISION_EXAMPLES=true
      - ATLAS_SOLR_MANAGED=false
      - ATLAS_NOTIFICATION_HOOK_IMPL_KAFKA=true
      - ATLAS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ATLAS_GRAPH_STORAGE_BACKEND=hbase
      - ATLAS_ZOOKEEPER_CONNECT=zookeeper:2181
    depends_on:
      - zookeeper
      - kafka
      - namenode_hadoop
      - datanode_hadoop
      - hiveserver2
    volumes:
      - ./atlas/conf:/opt/atlas/conf
      - ./atlas/data:/opt/atlas/data
    networks:
      - project_network
    restart: unless-stopped

  # Zookeeper (required for Atlas)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./zookeeper/data:/var/lib/zookeeper/data
      - ./zookeeper/log:/var/lib/zookeeper/log
    networks:
      - project_network
    restart: unless-stopped

  # Kafka (required for Atlas)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ./kafka/data:/var/lib/kafka/data
    networks:
      - project_network
    restart: unless-stopped

  # HBase (required for Atlas for graph storage)
  hbase:
    image: harisekhon/hbase:latest
    container_name: hbase
    hostname: hbase
    ports:
      - "16000:16000"  # HBase Master
      - "16010:16010"  # HBase Master Web UI
      - "16020:16020"  # HBase RegionServer
      - "16030:16030"  # HBase RegionServer Web UI
    environment:
      HBASE_MANAGES_ZK: "false"
      HBASE_ZOOKEEPER_QUORUM: zookeeper
    depends_on:
      - zookeeper
    volumes:
      - ./hbase/data:/hbase-data
    networks:
      - project_network
    restart: unless-stopped

  # Solr (used by Atlas for indexing)
  solr:
    image: solr:8
    container_name: solr
    hostname: solr
    ports:
      - "8983:8983"
    environment:
      SOLR_JAVA_MEM: "-Xms512m -Xmx1g"
#    volumes:
#      - ./solr/data:/var/solr
    command:
      - solr-precreate
      - atlas
    networks:
      - project_network
    restart: unless-stopped

volumes:
  hive_postgres_data:
  postgres_data:
  hive:
  hadoop:
    driver: local

networks:
  project_network:
    driver: bridge